name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les pushes rapprochés ne se doublent pas.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/yarn.lock
      - run: yarn --cwd app install --frozen-lockfile
      - run: yarn --cwd app build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Le pmtiles n'est pas régénéré ici : ./fetch.sh télécharge ~300 Mo et ./build.py
# tourne plusieurs minutes, pour une donnée qui bouge quelques fois par an.
# Publication à la main quand les zonages changent :
#   ./build.py --pmtiles
#   gh release create data-v2 out/bivouac.pmtiles --title "Données AAAA-MM"
# puis bump le tag dans src/components/CarteBivouac.vue.
