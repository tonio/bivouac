name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les pushes rapprochés ne se doublent pas.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/yarn.lock
      - run: yarn --cwd app install --frozen-lockfile
      - run: yarn --cwd app build
      # La donnée arrive dans le site plutôt que dans le dépôt : git garde ses
      # 840 Ko, et Pages sert le pmtiles en même-origine — donc avec les Range
      # requests dont PMTiles dépend, et sans CORS à négocier. Les release
      # assets, eux, redirigent vers une URL signée qui expire en ~1 h et ne
      # portent aucun en-tête CORS : inutilisables depuis le navigateur.
      - run: gh release download data-v1 -p bivouac.pmtiles -O app/dist/bivouac.pmtiles
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Le pmtiles n'est pas régénéré ici : pipeline/fetch.sh télécharge ~300 Mo et build.py
# tourne plusieurs minutes, pour une donnée qui bouge quelques fois par an.
# Mise à jour à la main quand les zonages changent — le tag data-v1 est fixe,
# on remplace son asset plutôt que d'avoir à toucher au workflow :
#   ./pipeline/build.py --pmtiles
#   gh release upload data-v1 pipeline/out/bivouac.pmtiles --clobber
